const tools=document.createElement('div');tools.id='pbm-tools';tools.innerHTML='<button class="pbm-fab" id="pbm-open-search" aria-label="Search this page" title="Search (/)">⌕</button><button class="pbm-fab" id="pbm-open-saved" aria-label="Saved favorites" title="Favorites">♡</button><button class="pbm-fab" id="pbm-to-top" aria-label="Back to top" title="Back to top">↑</button>';document.body.append(tools);
const overlay=document.createElement('div');overlay.id='pbm-search-overlay';overlay.hidden=true;overlay.innerHTML='<section class="pbm-search-dialog" role="dialog" aria-modal="true" aria-labelledby="pbm-search-title"><div class="pbm-search-head"><h2 id="pbm-search-title">Explore the PBM Original</h2><button type="button" class="pbm-close" id="pbm-search-close">✕ Close</button></div><input id="pbm-search-input" type="search" placeholder="Search breaks, cards, products…" autocomplete="off" aria-label="Search products"><div id="pbm-search-results" aria-live="polite"></div><p class="pbm-hint">Press / to search · Esc to close · ♡ saves favorites on this device</p></section>';document.body.append(overlay);
const input=$('#pbm-search-input'),results=$('#pbm-search-results');
let mode='search',previousFocus=null;
function getItems(){
const scope=$('#store-sections')||$('main')||document.body;
const selectors=['.product-card','.store-card','.item-card','.vault-card','.card-item','.product','.inventory-item','.glass-card','.item'];
let nodes=$$(selectors.join(','),scope).filter(el=>el.offsetWidth>0&&el.offsetHeight>0);
if(!nodes.length)nodes=$$('main a',scope).filter(a=>a.textContent.trim().length>8);
return nodes.filter((el,i)=>!nodes.some((p,j)=>j!==i&&p.contains(el))).slice(0,250).map((el,i)=>{
const heading=el.querySelector('h2,h3,h4,.product-title,.item-title,.card-title,.name,.title');
const name=(heading?.textContent||el.textContent||'').replace(/\s+/g,' ').trim().slice(0,100);
const link=el.matches('a[href]')?el:el.querySelector('a[href]');
if(!el.id)el.id='pbm-item-'+i;
return {el,name,href:link?.getAttribute('href')||('#'+el.id),key:(name||'item-'+i).toLowerCase()};
}).filter(o=>o.name.length>2);
}
function render(){
const items=getItems();
const q=input.value.trim().toLocaleLowerCase();
const filtered=mode==='saved'?items.filter(x=>saved.includes(x.key)):items.filter(x=>x.name.toLocaleLowerCase().includes(q));
results.replaceChildren();
if(!filtered.length){results.innerHTML='<p class="pbm-hint">'+(mode==='saved'?'No saved items currently visible on this page. Tap ♡ on a product to save it.':'No matching items yet. Try a different name.')+'</p>';return}
filtered.slice(0,40).forEach(o=>{
const a=document.createElement('a');a.className='pbm-result';a.href=o.href;
a.innerHTML='<span aria-hidden="true">'+(saved.includes(o.key)?'♥':'✦')+'</span><span>'+esc(o.name)+'</span>';
a.addEventListener('click',e=>{if(o.href.startsWith('#')){e.preventDefault();close();o.el.scrollIntoView({behavior:reduced?'instant':'smooth',block:'center'})}else close()});
results.append(a);
});
}
function open(which){mode=which;previousFocus=document.activeElement;overlay.hidden=false;document.body.style.overflow='hidden';$('#pbm-search-title').textContent=mode==='saved'?'Your saved favorites':'Explore the PBM Original';input.placeholder=mode==='saved'?'Filter saved favorites…':'Search breaks, cards, products…';input.value='';render();input.focus()}
function close(){overlay.hidden=true;document.body.style.overflow='';previousFocus?.focus?.()}
$('#pbm-open-search').onclick=()=>open('search');$('#pbm-open-saved').onclick=()=>open('saved');$('#pbm-search-close').onclick=close;$('#pbm-to-top').onclick=()=>scrollTo({top:0,behavior:reduced?'instant':'smooth'});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});input.addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)close();if(e.key==='/'&&overlay.hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&!document.activeElement?.isContentEditable){e.preventDefault();open('search')}if(e.key==='Tab'&&!overlay.hidden){const focusable=$$('button,input,a[href]',overlay).filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function toast(message){document.querySelector('.pbm-saved-toast')?.remove();const el=document.createElement('div');el.className='pbm-saved-toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),1900)}
let pending=false;
function enhance(){
pending=false;const items=getItems();
for(const o of items){
const el=o.el;
if(el.dataset.pbmEnhanced)return;
el.dataset.pbmEnhanced='1';
el.classList.add('pbm-card-sheen');
if(getComputedStyle(el).position==='static')el.style.position='relative';
const b=document.createElement('button');b.type='button';b.className='pbm-heart';b.textContent=saved.includes(o.key)?'♥':'♡';b.setAttribute('aria-label','Save '+o.name);b.setAttribute('aria-pressed',String(saved.includes(o.key)));b.title='Save to favorites';
b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const index=saved.indexOf(o.key);if(index>=0)saved.splice(index,1);else saved.push(o.key);persist();b.textContent=index>=0?'♡':'♥';b.setAttribute('aria-pressed',String(index<0));toast(index>=0?'Removed from favorites':'Saved to favorites ♥')});
el.append(b);
}
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(enhance)}}
schedule();const target=$('#store-sections')||$('main');if(target)new MutationObserver(schedule).observe(target,{childList:true,subtree:true});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const card=e.target.closest('.pbm-card-sheen');if(!card)return;const r=card.getBoundingClientRect();card.style.setProperty('--pbm-x',e.clientX-r.left+'px');card.style.setProperty('--pbm-y',e.clientY-r.top+'px')},{passive:true});
})();

<script>
/* PBM LEGENDARY EDITION — opt-in visual showcase, never an actual pack opening */
(()=>{
'use strict';
if(/^(admin|stock)\.html$/i.test(location.pathname.split('/').pop()||'index.html'))return;
const container=document.getElementById('store-sections');
if(!container)return;
const isVault=/vault\.html$/i.test(location.pathname);
const bar=document.createElement('section');bar.className='pbm-legendary-bar';bar.setAttribute('aria-label','Collector experience');
bar.innerHTML='<div class="pbm-legendary-top"><strong>✦ THE COLLECTOR EXPERIENCE</strong><span>Discover • Explore • Collect</span></div><div class="pbm-legendary-actions"><button class="pbm-action pbm-featured" id="pbm-showcase">✦ Mystery reveal preview</button><button class="pbm-action" id="pbm-sort-name">A–Z</button><button class="pbm-action" id="pbm-sort-price">Price: low to high</button><button class="pbm-action" id="pbm-filter-stock">Available only</button><button class="pbm-action" id="pbm-clear-filters">Reset view</button></div><div class="pbm-count" id="pbm-view-count">Loading collection…</div>';
container.parentElement.insertBefore(bar,container);
const overlay=document.createElement('div');overlay.className='pbm-legendary-overlay';overlay.hidden=true;
overlay.innerHTML='<section class="pbm-reveal-stage" role="dialog" aria-modal="true" aria-labelledby="pbm-reveal-heading"><h2 class="pbm-reveal-heading" id="pbm-reveal-heading">✦ MYSTERY REVEAL ✦</h2><p class="pbm-reveal-sub">An interactive preview featuring an item currently displayed on this page. No purchase, pack opening or prize is involved.</p><div class="pbm-reveal-art"><div class="pbm-reveal-card" id="pbm-reveal-card"></div></div><p class="pbm-reveal-name" id="pbm-reveal-name">Ready to reveal?</p><div class="pbm-reveal-controls"><button id="pbm-reveal-next">Reveal an item</button><button id="pbm-reveal-close">Close</button></div></section>';
document.body.append(overlay);
let lastFocus=null,sort='default',available=false,original=new WeakMap(),counter=0;
const cards=()=>Array.from(container.querySelectorAll('.neon-card-wrapper')).filter(el=>el.querySelector('.item-card'));
function details(card){
const heading=card.querySelector('.item-card h3,.item-card h2,.item-title,.card-name,.item-name,h3,h2');
const name=(heading?.textContent||card.querySelector('.item-card')?.textContent||'Collectible').replace(/\s+/g,' ').trim().slice(0,95);
const img=card.querySelector('.item-card img');
const text=card.textContent||'';
const priceMatch=text.match(/(?:[$€£]\s*\d[\d,.]*|\d[\d,.]*\s*(?:DKK|USD|EUR|kr))/i);
const price=priceMatch?Number((priceMatch[0].match(/[\d,.]+/)||[''])[0].replace(/,/g,'')):Infinity;
const out=/sold\s*out|out\s*of\s*stock|unavailable/i.test(text)||card.classList.contains('sold-out')||card.querySelector('[disabled].buy-btn,[disabled].purchase-btn');
return {card,name,img,price,out};
}
function apply(){
const all=cards();all.forEach((c,i)=>{if(!original.has(c))original.set(c,c.style.order||String(i))});
const arr=all.map(details);
if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));
if(sort==='price')arr.sort((a,b)=>a.price-b.price);
arr.forEach((o,i)=>{o.card.style.order=sort==='default'?original.get(o.card):String(i);o.card.classList.toggle('pbm-filter-hidden',available&&!!o.out)});
const count=arr.filter(o=>!available||!o.out).length;
document.getElementById('pbm-view-count').textContent=count+' of '+arr.length+' items shown'+(available?' · Available filter on':'');
}
document.getElementById('pbm-sort-name').onclick=()=>{sort='name';apply()};
document.getElementById('pbm-sort-price').onclick=()=>{sort='price';apply()};
document.getElementById('pbm-filter-stock').onclick=e=>{available=!available;e.currentTarget.setAttribute('aria-pressed',String(available));apply()};
document.getElementById('pbm-clear-filters').onclick=()=>{sort='default';available=false;document.getElementById('pbm-filter-stock').setAttribute('aria-pressed','false');apply()};
function reveal(){
const all=cards().filter(c=>!c.classList.contains('pbm-filter-hidden')).map(details);
if(!all.length){document.getElementById('pbm-reveal-name').textContent='No items are currently available to preview.';return}
const chosen=all[Math.floor(Math.random()*all.length)];
const el=document.getElementById('pbm-reveal-card');el.classList.remove('revealed');el.replaceChildren();
const name=document.getElementById('pbm-reveal-name');name.textContent='Revealing…';
requestAnimationFrame(()=>requestAnimationFrame(()=>{if(chosen.img?.src){const img=document.createElement('img');img.src=chosen.img.src;img.alt=chosen.name;el.append(img)}else el.textContent='✦';el.classList.add('revealed');name.textContent=chosen.name}));
}
function close(){overlay.hidden=true;document.body.style.overflow='';lastFocus?.focus?.()}
document.getElementById('pbm-showcase').onclick=()=>{lastFocus=document.activeElement;overlay.hidden=false;document.body.style.overflow='hidden';reveal();document.getElementById('pbm-reveal-next').focus()};
document.getElementById('pbm-reveal-next').onclick=reveal;
document.getElementById('pbm-reveal-close').onclick=close;
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const a=[document.getElementById('pbm-reveal-next'),document.getElementById('pbm-reveal-close')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a[1].focus()}else if(!e.shiftKey&&document.activeElement===a[1]){e.preventDefault();a[0].focus()}}});
let scheduled=false;
new MutationObserver(()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;apply()})}).observe(container,{childList:true,subtree:false});
apply();
})();
